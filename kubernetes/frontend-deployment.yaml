apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: todo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: swarupsinh10/todo-frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80
